name: sim-rs
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown
      - run: cargo build --manifest-path sim-rs/Cargo.toml
      - run: cargo build --manifest-path sim-rs/Cargo.toml --target wasm32-unknown-unknown
      - run: cargo test --manifest-path sim-rs/Cargo.toml
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # §10: CI fails on unlisted WASM imports (boundary creep gate).
      - run: node tools/wasm-imports.js --selftest
      - run: node tools/dual.js --pre 0 --ticks 600
      # §6.1 gate: EOS + curves vs JS (fresh baseline recorded by the gate).
      - run: node tools/eos-gate.js --vectors 1000000
      # §6.2a gate: linear solve core, bit-exact on real solve traffic.
      - run: node tools/solve-gate.js --ticks 120
      # §6.2b gate: hydraulics leaves fuzz vs JS.
      - run: node tools/hydro-gate.js --queries 500000
      - run: node tools/pstar-gate.js --vectors 200000
      # §6.2c gate: nodal field update on preset traffic.
      - run: node tools/field-gate.js --ticks 120
      # §6.2d gate: pieces + fixed set, bit-exact.
      - run: node tools/pieces-gate.js --ticks 120
      # §6.2e gate: storage rows on preset traffic.
      - run: node tools/store-gate.js --ticks 120
      # §6.2f gate: edge terms on preset traffic.
      - run: node tools/edge-gate.js --ticks 120
      # Full §6.2 gate: fixed-S solve end to end (field to readers).
      - run: node tools/solvefull-gate.js --ticks 120
      # §6.2f gate: edge terms on preset traffic.
      - run: node tools/edge-gate.js --ticks 120
      # §6.3 gate: transport (advectStep + injectFluid) on preset traffic.
      - run: node tools/transport-gate.js --ticks 120
      # §6.4 gate: nodal core (kinetics/decay/rod/vessel/melt) + synth fuzz.
      - run: node tools/core-gate.js --ticks 120
      # §6.5 gate: control cabinet (ctlPass + sinks), bit-exact.
      - run: node tools/ctl-gate.js --ticks 120
      # §6.6 gate (sec): secondary side + tick actuators + burst dice.
      - run: node tools/sec-gate.js --ticks 120
      # §6.6 gate (room): sump + compartment tick vs JS, bit-exact.
      - run: node tools/room-gate.js --ticks 120
      # §6.6 gate (events): damage/cook/latch/repair/ledger + synth fuzz, bit-exact.
      - run: node tools/events-gate.js --ticks 120
      # §6.7 gate: full stepMarch dual-run, all presets x 120 ticks.
      - run: node tools/step-gate.js --ticks 120
